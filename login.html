<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login de O.S.</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }

    .tab-buttons {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .tab-button {
      flex: 1;
      padding: 0.5rem 0;
      border: none;
      background: transparent;
      color: #ddd;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .tab-button.active {
      color: white;
      border-color: white;
      font-weight: 800;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 1rem;
      font-weight: 600;
    }

    input[type="text"],
    input[type="password"] {
      margin-top: 0.25rem;
      padding: 0.5rem;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background-color: #4c51bf;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #3c429f;
    }

    .hidden {
      display: none;
    }

    .info-text {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #ccc;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Monitoramento de O.S.</h1>
    <div class="tab-buttons">
      <button id="tab-login" class="tab-button active">Login</button>
      <button id="tab-register" class="tab-button">Cadastro</button>
    </div>
    <div id="login-panel">
      <form id="login-form">
        <label for="login-username">Username:</label>
        <input type="text" id="login-username" name="username" required autocomplete="username" />
        <label for="login-password">Password:</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password" />
        <button type="submit">Login</button>
      </form>
    </div>
    <div id="register-panel" class="hidden">
      <form id="register-form">
        <label for="register-username">Novo Usuário:</label>
        <input type="text" id="register-username" name="username" required autocomplete="username" />
        <label for="register-password">Senha:</label>
        <input type="password" id="register-password" name="password" required autocomplete="new-password" />
        <label for="register-password-confirm">Confirmar Senha:</label>
        <input type="password" id="register-password-confirm" name="password-confirm" required autocomplete="new-password" />
        <button type="submit">Cadastrar</button>
      </form>
      <p class="info-text">Máximo 2 usuários podem ser cadastrados.</p>
    </div>
    <p class="info-text" id="error-message"></p>
  </div>

  <script>
    const tabLoginBtn = document.getElementById('tab-login');
    const tabRegisterBtn = document.getElementById('tab-register');
    const loginPanel = document.getElementById('login-panel');
    const registerPanel = document.getElementById('register-panel');
    const errorMsg = document.getElementById('error-message');

    tabLoginBtn.addEventListener('click', () => {
      tabLoginBtn.classList.add('active');
      tabRegisterBtn.classList.remove('active');
      loginPanel.classList.remove('hidden');
      registerPanel.classList.add('hidden');
      errorMsg.textContent = '';
    });

    tabRegisterBtn.addEventListener('click', () => {
      tabRegisterBtn.classList.add('active');
      tabLoginBtn.classList.remove('active');
      registerPanel.classList.remove('hidden');
      loginPanel.classList.add('hidden');
      errorMsg.textContent = '';
    });

    function getUsers() {
      const usersJSON = localStorage.getItem('os_monitor_users');
      return usersJSON ? JSON.parse(usersJSON) : [];
    }

    function saveUsers(users) {
      localStorage.setItem('os_monitor_users', JSON.stringify(users));
    }

    const registerForm = document.getElementById('register-form');
    registerForm.addEventListener('submit', e => {
      e.preventDefault();
      errorMsg.textContent = '';
      const username = registerForm['register-username'].value.trim();
      const password = registerForm['register-password'].value;
      const passwordConfirm = registerForm['register-password-confirm'].value;

      if (!username || !password || !passwordConfirm) {
        errorMsg.textContent = 'Por favor, preencha todos os campos.';
        return;
      }

      if (password !== passwordConfirm) {
        errorMsg.textContent = 'As senhas não coincidem.';
        return;
      }

      const users = getUsers();
      if (users.length >= 2) {
        errorMsg.textContent = 'Limite de 2 usuários cadastrados atingido.';
        return;
      }

      if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        errorMsg.textContent = 'Nome de usuário já existe.';
        return;
      }

      users.push({ username, password });
      saveUsers(users);
      alert('Usuário cadastrado com sucesso! Agora faça login.');
      registerForm.reset();
      tabLoginBtn.click();
    });

    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      errorMsg.textContent = '';
      const username = loginForm['login-username'].value.trim();
      const password = loginForm['login-password'].value;

      const users = getUsers();
      const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());

      if (!user) {
        errorMsg.textContent = 'Usuário não encontrado.';
        return;
      }

      if (user.password !== password) {
        errorMsg.textContent = 'Senha incorreta.';
        return;
      }

localStorage.setItem('os_monitor_logged_user', username);
window.location.href = '../monitoramento.html';

// redirecionamento após login
    });
  </script>
</body>
</html>
